name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      NEXT_PUBLIC_APP_URL: https://mushroomie.io.vn
      NEXT_PUBLIC_SITE_URL: https://mushroomie.io.vn
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run test:coverage:all

      - run: npm run lint

      - run: npm run build
