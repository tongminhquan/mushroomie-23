name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mushroomie_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NEXT_PUBLIC_APP_URL: https://mushroomie.io.vn
      NEXT_PUBLIC_SITE_URL: https://mushroomie.io.vn
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/mushroomie_ci
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm exec prisma generate

      - run: npm exec prisma db push

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
