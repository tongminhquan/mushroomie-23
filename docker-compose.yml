version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mushroomie_db
    restart: always
    environment:
      # Lấy pass từ file .env hoặc sử dụng mặc định
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Conma11062008@}
      MYSQL_DATABASE: mushroomie
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  web:
    build: .
    container_name: mushroomie_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Ghi đè DATABASE_URL để trỏ vào service db thay vì localhost
      - DATABASE_URL=mysql://root:Conma11062008@@db:3306/mushroomie
    depends_on:
      - db

volumes:
  db_data:
