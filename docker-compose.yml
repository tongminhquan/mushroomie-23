version: '3.8'

services:
  web:
    build:
      context: .
      network: host
    container_name: mushroomie_web
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
