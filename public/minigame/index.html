<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Classic – Xếp gạch</title>
  <link rel="stylesheet" href="xepgach/style.css">
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container">
      <!-- Left: Game Board -->
      <div id="board-area">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="board-glow"></div>
      </div>

      <!-- Right: Sidebar -->
      <div id="sidebar">
        <!-- Score -->
        <div class="stat-card">
          <div class="stat-label">ĐIỂM SỐ</div>
          <div class="stat-value" id="score">0</div>
          <div class="stat-bar">
            <div class="stat-bar-fill" id="score-bar"></div>
          </div>
        </div>

        <!-- Lines -->
        <div class="stat-card">
          <div class="stat-label">HÀNG ĐÃ XÓA</div>
          <div class="stat-value" id="lines">0</div>
        </div>

        <!-- Level -->
        <div class="stat-card">
          <div class="stat-label">CẤP ĐỘ</div>
          <div class="stat-value level-text" id="level-display">1</div>
        </div>

        <!-- Next Piece -->
        <div class="stat-card next-card">
          <div class="stat-label">KHỐI TIẾP THEO</div>
          <div class="next-preview">
            <canvas id="next" width="120" height="100"></canvas>
          </div>
        </div>

        <!-- Controls Hint -->
        <div class="controls-hint">
          <div class="hint-title">ĐIỀU KHIỂN</div>
          <div class="hint-grid">
            <div class="hint-item"><span class="key">←→</span><span class="hint-desc">Di chuyển</span></div>
            <div class="hint-item"><span class="key">↑</span><span class="hint-desc">Xoay</span></div>
            <div class="hint-item"><span class="key">↓</span><span class="hint-desc">Rơi nhanh</span></div>
            <div class="hint-item"><span class="key">Space</span><span class="hint-desc">Rơi liền</span></div>
            <div class="hint-item"><span class="key">R</span><span class="hint-desc">Chơi lại</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Controls -->
    <div id="controls">
      <div class="controls-row">
        <button class="ctrl-btn" onclick="move(-1);" aria-label="Move Left">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="ctrl-btn ctrl-rotate" onclick="rotate()" aria-label="Rotate">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button class="ctrl-btn" onclick="move(1);" aria-label="Move Right">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="controls-row">
        <button class="ctrl-btn ctrl-down" onclick="softDrop();" aria-label="Soft Drop">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <button class="ctrl-btn ctrl-hard" onclick="hardDrop();" aria-label="Hard Drop">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"></polyline><polyline points="7 6 12 11 17 6"></polyline></svg>
        </button>
      </div>
    </div>
  </div>
  <script src="xepgach/game.js"></script>
</body>
</html>
