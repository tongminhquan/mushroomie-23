server {
    server_name 103.173.226.86 mushroomie.io.vn www.mushroomie.io.vn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Set root to the Next.js public directory
    root /var/www/mushroomie/public;

    # Next.js static assets - served directly from filesystem
    location /_next/static/ {
        alias /var/www/mushroomie/.next/static/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Try serving static files from public first, fallback to Next.js proxy
    location / {
        try_files $uri @nextjs;
    }

    # Default proxy to Next.js
    location @nextjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mushroomie.io.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mushroomie.io.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.mushroomie.io.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = mushroomie.io.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 103.173.226.86 mushroomie.io.vn www.mushroomie.io.vn;
    return 404; # managed by Certbot
}
