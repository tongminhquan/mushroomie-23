server {
    listen 80;
    listen 443 ssl;
    server_name 103.77.242.153 mushroomie.io.vn www.mushroomie.io.vn;

    # Emergency compatibility profile for the 2026-07-13 Cloudflare PQ
    # origin incident. Remove after upgrading the origin to OpenSSL 3.5+.
    ssl_certificate /etc/ssl/mushroomie/origin.crt;
    ssl_certificate_key /etc/ssl/mushroomie/origin.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers AES256-GCM-SHA384:AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location /_next/static/ {
        alias /var/www/mushroomie/.next/static/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /uploads/ {
        alias /var/www/mushroomie/public/uploads/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
